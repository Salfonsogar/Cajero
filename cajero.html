<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cajero Automático</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --body-metal-1:#2b2f33;
    --body-metal-2:#1a1d20;
    --body-metal-3:#3d4247;
    --screen-bg:#0b0e0a;
    --screen-amber:#ffb000;
    --screen-amber-dim:#7a5600;
    --slot-shadow:#000000;
    --paper:#e9e6dd;
    --ink:#1a1d20;
    --accent-green:#3fae5c;
    --accent-green-dark:#2c7d41;
    --danger:#c1443a;
    --font-display:'JetBrains Mono', monospace;
    --font-body:'Manrope', sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, #2a2e33 0%, #101214 65%);
    font-family:var(--font-body);
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .rig{
    width:100%;
    max-width:480px;
  }

  .brand{
    text-align:center;
    margin-bottom:18px;
    letter-spacing:.32em;
    font-size:11px;
    text-transform:uppercase;
    color:#8a8f94;
    font-weight:700;
  }
  .brand span{color:var(--accent-green);}

  .machine{
    background:linear-gradient(160deg, var(--body-metal-1), var(--body-metal-2) 60%, #101214);
    border-radius:26px;
    padding:22px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,.7),
      inset 0 1px 0 rgba(255,255,255,.06),
      inset 0 0 0 1px rgba(0,0,0,.4);
    position:relative;
  }
  .machine::before{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.04);
    pointer-events:none;
  }

  .cam{
    position:absolute;
    top:18px;
    right:26px;
    width:9px;
    height:9px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #4a4f54, #050505 70%);
    box-shadow:0 0 0 3px rgba(0,0,0,.35);
  }

  .screen-frame{
    background:#000;
    border-radius:12px;
    padding:16px 16px 14px;
    box-shadow:inset 0 0 0 2px #26292c, inset 0 0 24px rgba(0,0,0,.9);
  }

  .screen{
    background:
      linear-gradient(rgba(0,0,0,0) 0%, rgba(0,0,0,.25) 100%),
      var(--screen-bg);
    border-radius:6px;
    min-height:220px;
    padding:16px 14px;
    font-family:var(--font-display);
    color:var(--screen-amber);
    text-shadow:0 0 6px rgba(255,176,0,.45);
    font-size:13px;
    line-height:1.65;
    position:relative;
    overflow:hidden;
  }
  .screen::after{
    content:"";
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,.18) 3px
    );
    pointer-events:none;
    mix-blend-mode:multiply;
  }

  .prompt-line{display:flex; gap:8px; margin-bottom:2px;}
  .prompt-line .caret{color:var(--screen-amber-dim);}

  .screen .muted{color:var(--screen-amber-dim);}

  .amount-input{
    background:transparent;
    border:none;
    border-bottom:1px solid var(--screen-amber-dim);
    color:var(--screen-amber);
    font-family:var(--font-display);
    font-size:15px;
    font-weight:700;
    width:140px;
    padding:2px 2px 4px 0;
    outline:none;
    text-shadow:0 0 6px rgba(255,176,0,.45);
  }
  .amount-input::placeholder{color:#6b4a06;}
  .amount-input::-webkit-outer-spin-button,
  .amount-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

  .breakdown{margin-top:10px;}
  .breakdown-row{
    display:flex;
    justify-content:space-between;
    padding:2px 0;
  }
  .breakdown-row .dots{
    flex:1;
    border-bottom:1px dotted var(--screen-amber-dim);
    margin:0 6px;
    transform:translateY(-4px);
  }
  .total-row{
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid var(--screen-amber-dim);
    display:flex;
    justify-content:space-between;
    font-weight:700;
  }

  .error{color:#ff6b5e; text-shadow:0 0 6px rgba(255,107,94,.5);}

  .blink{animation:blink 1.1s steps(2, start) infinite;}
  @keyframes blink{ to { visibility:hidden; } }

  .controls{
    display:flex;
    gap:10px;
    margin-top:16px;
  }

  .btn{
    font-family:var(--font-body);
    font-weight:700;
    font-size:13px;
    letter-spacing:.02em;
    border:none;
    border-radius:9px;
    padding:12px 14px;
    cursor:pointer;
    flex:1;
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:active{transform:translateY(1px) scale(.99);}

  .btn-primary{
    background:linear-gradient(180deg, var(--accent-green), var(--accent-green-dark));
    color:#0d1f12;
    box-shadow:0 6px 14px -6px rgba(63,174,92,.6), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .btn-primary:hover{filter:brightness(1.06);}

  .btn-ghost{
    background:#26292c;
    color:#b7bcc1;
    flex:0 0 auto;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .btn-ghost:hover{filter:brightness(1.15);}

  .slot{
    margin-top:20px;
    background:linear-gradient(180deg, #0e0f10, #050505);
    border-radius:8px;
    padding:14px 14px 4px;
    box-shadow:inset 0 6px 14px -6px #000, inset 0 0 0 1px rgba(255,255,255,.03);
  }
  .slot-label{
    font-size:9px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:#5a5f63;
    margin-bottom:10px;
    text-align:center;
  }

  .bills{
    min-height:64px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:4px;
    padding-bottom:14px;
    flex-wrap:wrap;
  }

  .bill{
    width:46px;
    height:22px;
    border-radius:3px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-display);
    font-size:9px;
    font-weight:800;
    color:rgba(0,0,0,.55);
    box-shadow:0 2px 4px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.25);
    opacity:0;
    transform:translateY(10px) scale(.9);
    animation:billIn .32s ease forwards;
  }
  .bill::before{
    content:"";
    position:absolute;
    inset:3px;
    border:1px dashed rgba(0,0,0,.25);
    border-radius:2px;
  }
  .bill.d10{background:linear-gradient(135deg,#8fd6b4,#5fb98a);}
  .bill.d20{background:linear-gradient(135deg,#8fc4e0,#5b9fc4);}
  .bill.d50{background:linear-gradient(135deg,#e0c98f,#c9a15b);}
  .bill.d100{background:linear-gradient(135deg,#dca6c2,#c46f97);}

  @keyframes billIn{
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  .empty-note{
    font-size:11px;
    color:#4a4e52;
    text-align:center;
    width:100%;
    padding:6px 0 2px;
  }

  @media (prefers-reduced-motion: reduce){
    .bill{animation:none; opacity:1; transform:none;}
    .blink{animation:none;}
  }

  @media (max-width:400px){
    .screen{font-size:12px;}
  }
</style>
</head>
<body>

<div class="rig">
  <div class="brand">Banco <span>Terminal</span> · Cajero Automático</div>

  <div class="machine">
    <div class="cam"></div>

    <div class="screen-frame">
      <div class="screen" id="screen">
        <div class="prompt-line"><span class="caret">&gt;</span><span>Bienvenido al Cajero Automático</span></div>
        <div class="prompt-line" style="margin-top:8px;">
          <span class="caret">&gt;</span>
          <span>Ingrese el monto a retirar</span>
        </div>
        <div class="prompt-line">
          <span class="caret">$</span>
          <input class="amount-input" id="monto" type="number" inputmode="numeric" placeholder="0" autofocus>
          <span class="blink">▌</span>
        </div>

        <div id="output"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="retirarBtn">Retirar</button>
      <button class="btn btn-ghost" id="limpiarBtn" title="Limpiar">⟲</button>
    </div>

    <div class="slot">
      <div class="slot-label">Bandeja de billetes</div>
      <div class="bills" id="bills">
        <div class="empty-note">— sin retiro aún —</div>
      </div>
    </div>
  </div>
</div>

<script>
  // ---------------------------------------------------------------
  // Misma lógica que el programa original en C# (Program.cs)
  // ---------------------------------------------------------------

  function calcularCiclos(restante, cantidad) {
    if (restante <= 0) return restante;

    const full = 600;
    const unidades = [1, 2, 3, 4];
    const ciclos = Math.floor(restante / full);

    if (ciclos === 0) return restante;

    for (let i = 0; i < cantidad.length; i++) {
      cantidad[i] += ciclos * unidades[i];
    }

    return restante - ciclos * full;
  }

  function calcularRetiro(monto) {
    const denominaciones = [10, 20, 50, 100];
    const cantidad = [0, 0, 0, 0];

    if (monto <= 0 || monto % denominaciones[0] !== 0) return cantidad;

    let restante = monto;
    restante = calcularCiclos(restante, cantidad);

    while (restante > 0) {
      const antes = restante;

      for (let skip = 0; skip < denominaciones.length && restante > 0; skip++) {
        for (let j = skip; j < denominaciones.length && restante >= denominaciones[j]; j++) {
          cantidad[j]++;
          restante -= denominaciones[j];
        }
      }

      if (restante === antes) break;
    }

    return cantidad;
  }

  // ---------------------------------------------------------------
  // Interfaz
  // ---------------------------------------------------------------

  const montoInput = document.getElementById('monto');
  const output = document.getElementById('output');
  const billsBox = document.getElementById('bills');
  const retirarBtn = document.getElementById('retirarBtn');
  const limpiarBtn = document.getElementById('limpiarBtn');

  const nombres = ['$10', '$20', '$50', '$100'];
  const clases = ['d10', 'd20', 'd50', 'd100'];

  function renderError(msg) {
    output.innerHTML = `
      <div class="prompt-line" style="margin-top:10px;">
        <span class="caret error">!</span>
        <span class="error">${msg}</span>
      </div>
    `;
    billsBox.innerHTML = '<div class="empty-note">— sin retiro aún —</div>';
  }

  function renderResultado(monto, cantidad) {
    const rows = nombres.map((n, i) => `
      <div class="breakdown-row">
        <span>Billetes de ${n}</span>
        <span class="dots"></span>
        <span>${cantidad[i]}</span>
      </div>
    `).join('');

    output.innerHTML = `
      <div class="breakdown">
        <div class="prompt-line"><span class="caret">&gt;</span><span>Desglose para $${monto}:</span></div>
        ${rows}
        <div class="total-row"><span>Total entregado</span><span>$${monto}</span></div>
      </div>
    `;

    // bandeja de billetes
    billsBox.innerHTML = '';
    const totalBills = cantidad.reduce((a, b) => a + b, 0);

    if (totalBills === 0) {
      billsBox.innerHTML = '<div class="empty-note">— no hay billetes para este monto —</div>';
      return;
    }

    // límite visual para no saturar la bandeja en montos grandes
    const MAX_VISUAL = 60;
    let shown = 0;
    let delay = 0;

    for (let i = 0; i < cantidad.length; i++) {
      for (let k = 0; k < cantidad[i] && shown < MAX_VISUAL; k++) {
        const bill = document.createElement('div');
        bill.className = `bill ${clases[i]}`;
        bill.style.animationDelay = `${delay}ms`;
        bill.textContent = nombres[i];
        billsBox.appendChild(bill);
        shown++;
        delay += 18;
      }
    }

    if (totalBills > MAX_VISUAL) {
      const note = document.createElement('div');
      note.className = 'empty-note';
      note.textContent = `+ ${totalBills - MAX_VISUAL} billetes más`;
      billsBox.appendChild(note);
    }
  }

  function retirar() {
    const raw = montoInput.value.trim();
    const monto = parseInt(raw, 10);

    if (raw === '' || Number.isNaN(monto)) {
      renderError('Ingrese un monto válido');
      return;
    }

    if (monto <= 0 || monto % 10 !== 0) {
      renderError('El monto debe ser positivo y múltiplo de $10');
      return;
    }

    const cantidad = calcularRetiro(monto);
    renderResultado(monto, cantidad);
  }

  function limpiar() {
    montoInput.value = '';
    output.innerHTML = '';
    billsBox.innerHTML = '<div class="empty-note">— sin retiro aún —</div>';
    montoInput.focus();
  }

  retirarBtn.addEventListener('click', retirar);
  limpiarBtn.addEventListener('click', limpiar);
  montoInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') retirar();
  });
</script>

</body>
</html>
