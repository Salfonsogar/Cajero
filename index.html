<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cajero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="rig">
    <div class="brand"> <span>Cajero Automático</span></div>
    <div class="machine">
      <div class="cam"></div>
      <div class="screen-frame">
        <div class="screen" id="screen"></div>
      </div>

      <div class="controls" id="controls"></div>

      <div class="slot">
        <div class="slot-label">Bandeja de billetes</div>
        <div class="bills" id="bills">
          <div class="empty-note">— sin retiro aún —</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DENOMINACIONES = [10000, 20000, 50000, 100000];

    function calcularRetiroCarreo(monto) {
      const cantidad = [0, 0, 0, 0];
      if (monto <= 0 || monto % DENOMINACIONES[0] !== 0) return cantidad;

      let restante = monto;

      while (restante > 0) {
        const antes = restante;
        for (let skip = 0; skip < DENOMINACIONES.length && restante > 0; skip++) {
          for (let j = skip; j < DENOMINACIONES.length && restante >= DENOMINACIONES[j]; j++) {
            cantidad[j]++;
            restante -= DENOMINACIONES[j];
          }
        }
        if (restante === antes) break;
      }
      return cantidad;
    }

    function esMontoValido(monto) {
      return Number.isInteger(monto) && monto > 0 && monto % DENOMINACIONES[0] === 0;
    }

    function formatCOP(n) {
      return '$' + n.toLocaleString('es-CO');
    }

    const state = {
      step: 'account-type',
      accountType: null,
      accountNumber: '',
      pin: '',
      nequiCode: null,
      nequiTimer: null,
      nequiSecondsLeft: 60,
      monto: null,
      errorMsg: ''
    };

    const NOMBRES = ['$10.000', '$20.000', '$50.000', '$100.000'];
    const CLASES = ['d10000', 'd20000', 'd50000', 'd100000'];
    const MONTOS_FIJOS = [20000, 50000, 100000, 200000, 300000, 500000];

    const screenEl = document.getElementById('screen');
    const controlsEl = document.getElementById('controls');
    const billsEl = document.getElementById('bills');

    function resetAll() {
      if (state.nequiTimer) clearInterval(state.nequiTimer);
      Object.assign(state, {
        step: 'account-type',
        accountType: null,
        accountNumber: '',
        pin: '',
        nequiCode: null,
        nequiTimer: null,
        nequiSecondsLeft: 60,
        monto: null,
        errorMsg: ''
      });
      billsEl.innerHTML = '<div class="empty-note">— sin retiro aún —</div>';
      render();
    }

    function goError(msg) {
      if (state.nequiTimer) clearInterval(state.nequiTimer);
      state.errorMsg = msg;
      state.step = 'error';
      render();
    }

    function render() {
      if (state.step === 'account-type') return renderAccountType();
      if (state.step === 'account-number') return renderAccountNumber();
      if (state.step === 'auth') return renderAuth();
      if (state.step === 'amount') return renderAmount();
      if (state.step === 'result') return renderResult();
      if (state.step === 'error') return renderErrorScreen();
    }

    function renderAccountType() {
      screenEl.innerHTML = `
      <div class="prompt-line"><span class="caret">&gt;</span><span>Bienvenido al Cajero Automático</span></div>
      <div class="prompt-line"><span class="caret">&gt;</span><span>Seleccione el tipo de cuenta para el retiro</span></div>
    `;
      controlsEl.innerHTML = `
      <button class="btn btn-account" data-type="nequi">NEQUI</button>
      <button class="btn btn-account" data-type="mano">Ahorro a la mano</button>
      <button class="btn btn-account" data-type="ahorros">Cuenta de ahorros</button>
    `;
      controlsEl.querySelectorAll('[data-type]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.accountType = btn.dataset.type;
          state.step = 'account-number';
          render();
        });
      });
    }
    function renderAccountNumber() {
      const cfg = {
        nequi: { title: 'Ingrese el número de celular', maxlen: 10, hint: 'Solo números, sin letras ni caracteres especiales.' },
        mano: { title: 'Ingrese el número de cuenta', maxlen: 11, hint: 'Debe iniciar en 0 o 1, y el segundo dígito debe ser 3. Ej: 03XXXXXXXXX' },
        ahorros: { title: 'Ingrese el número de cuenta de ahorros', maxlen: 11, hint: 'Solo números del 0 al 9, sin letras ni caracteres especiales.' }
      }[state.accountType];

      screenEl.innerHTML = `
      <div class="prompt-line"><span class="caret">&gt;</span><span>${cfg.title}</span></div>
      <input class="field-input" id="acctInput" type="text" inputmode="numeric" maxlength="${cfg.maxlen}" placeholder="${'0'.repeat(cfg.maxlen)}" value="${state.accountNumber}">
      <div class="field-hint">${cfg.hint}</div>
      <div id="acctFeedback"></div>
    `;

      controlsEl.innerHTML = `
      <button class="btn btn-ghost" id="backBtn">← Volver</button>
      <button class="btn btn-primary" id="nextBtn" disabled>Continuar</button>
    `;

      const input = document.getElementById('acctInput');
      const feedback = document.getElementById('acctFeedback');
      const nextBtn = document.getElementById('nextBtn');

      input.addEventListener('input', () => {
        input.value = input.value.replace(/[^0-9]/g, '').slice(0, cfg.maxlen);
        const valido = validarCuenta(state.accountType, input.value);
        if (input.value.length === cfg.maxlen && !valido) {
          feedback.innerHTML = `<div class="prompt-line"><span class="caret error">!</span><span class="error">Número inválido para este tipo de cuenta</span></div>`;
        } else {
          feedback.innerHTML = '';
        }
        nextBtn.disabled = !valido;
      });

      document.getElementById('backBtn').addEventListener('click', () => {
        state.step = 'account-type';
        render();
      });

      nextBtn.addEventListener('click', () => {
        state.accountNumber = input.value;
        state.step = 'auth';
        render();
      });

      input.focus();
    }

    function validarCuenta(tipo, num) {
      if (tipo === 'nequi') return /^[0-9]{10}$/.test(num);
      if (tipo === 'mano') return /^[01]3[0-9]{9}$/.test(num);
      if (tipo === 'ahorros') return /^[0-9]{11}$/.test(num);
      return false;
    }

    function renderAuth() {
      if (state.accountType === 'nequi') return renderAuthNequi();
      return renderAuthPin();
    }

    function renderAuthNequi() {
      function nuevoCodigo() {
        state.nequiCode = String(Math.floor(100000 + Math.random() * 900000));
        state.nequiSecondsLeft = 60;
      }
      if (!state.nequiCode) nuevoCodigo();

      screenEl.innerHTML = `
      <div class="prompt-line"><span class="caret">&gt;</span><span>Clave dinámica de seguridad NEQUI</span></div>
      <div class="code-box" id="codeBox"></div>
      <div class="timer-row">
        <span id="secLabel" class="muted"></span>
        <div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
      </div>
      <div class="field-hint">Esta clave es solo visible en pantalla y se renueva automáticamente cada 60 segundos.</div>
    `;

      controlsEl.innerHTML = `
      <button class="btn btn-ghost" id="backBtn">← Volver</button>
      <button class="btn btn-primary" id="nextBtn">Continuar</button>
    `;

      function paintCode() {
        document.getElementById('codeBox').innerHTML =
          state.nequiCode.split('').map(d => `<div class="code-digit">${d}</div>`).join('');
        document.getElementById('secLabel').textContent = `expira en ${state.nequiSecondsLeft}s`;
        document.getElementById('timerFill').style.width = (state.nequiSecondsLeft / 60 * 100) + '%';
      }
      paintCode();

      if (state.nequiTimer) clearInterval(state.nequiTimer);
      state.nequiTimer = setInterval(() => {
        state.nequiSecondsLeft--;
        if (state.nequiSecondsLeft <= 0) {
          nuevoCodigo();
        }
        const secLabel = document.getElementById('secLabel');
        const timerFill = document.getElementById('timerFill');
        const codeBox = document.getElementById('codeBox');
        if (!secLabel || !timerFill || !codeBox) { clearInterval(state.nequiTimer); return; }
        codeBox.innerHTML = state.nequiCode.split('').map(d => `<div class="code-digit">${d}</div>`).join('');
        secLabel.textContent = `expira en ${state.nequiSecondsLeft}s`;
        timerFill.style.width = (state.nequiSecondsLeft / 60 * 100) + '%';
      }, 1000);

      document.getElementById('backBtn').addEventListener('click', () => {
        clearInterval(state.nequiTimer);
        state.nequiTimer = null;
        state.nequiCode = null;
        state.step = 'account-number';
        render();
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        clearInterval(state.nequiTimer);
        state.nequiTimer = null;
        state.step = 'amount';
        render();
      });
    }

    function renderAuthPin() {
      screenEl.innerHTML = `
      <div class="prompt-line"><span class="caret">&gt;</span><span>Ingrese su clave de 4 dígitos</span></div>
      <input class="field-input pin" id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
      <div class="field-hint">La clave no se muestra en pantalla.</div>
      <div id="pinFeedback"></div>
    `;
      controlsEl.innerHTML = `
      <button class="btn btn-ghost" id="backBtn">← Volver</button>
      <button class="btn btn-primary" id="nextBtn" disabled>Confirmar</button>
    `;

      const input = document.getElementById('pinInput');
      const nextBtn = document.getElementById('nextBtn');

      input.addEventListener('input', () => {
        input.value = input.value.replace(/[^0-9]/g, '').slice(0, 4);
        nextBtn.disabled = input.value.length !== 4;
      });

      document.getElementById('backBtn').addEventListener('click', () => {
        state.step = 'account-number';
        render();
      });

      nextBtn.addEventListener('click', () => {
        state.pin = input.value;
        state.step = 'amount';
        render();
      });

      input.focus();
    }

    function renderAmount() {
      screenEl.innerHTML = `
      <div class="prompt-line"><span class="caret">&gt;</span><span>Seleccione el valor a retirar</span></div>
      <div class="field-hint">No se dispensan billetes de $5.000. Solo valores múltiplos de $10.000.</div>
      <div id="otroWrap" style="display:none; margin-top:6px;">
        <input class="field-input" id="otroInput" type="text" inputmode="numeric" placeholder="Ingrese un valor">
      </div>
      <div id="amountFeedback"></div>
    `;

      controlsEl.innerHTML = `
      ${MONTOS_FIJOS.map(m => `<button class="btn btn-amount" data-monto="${m}">${formatCOP(m)}</button>`).join('')}
      <button class="btn btn-amount" id="otroBtn">Otro</button>
      <button class="btn btn-ghost" id="backBtn">← Volver</button>
      <button class="btn btn-primary" id="retirarBtn">Retirar</button>
    `;

      let seleccionFija = null;
      const otroWrap = document.getElementById('otroWrap');
      const otroInput = document.getElementById('otroInput');
      const feedback = document.getElementById('amountFeedback');

      controlsEl.querySelectorAll('[data-monto]').forEach(btn => {
        btn.addEventListener('click', () => {
          seleccionFija = parseInt(btn.dataset.monto, 10);
          otroInput.value = '';
          otroWrap.style.display = 'none';
          controlsEl.querySelectorAll('[data-monto]').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          feedback.innerHTML = '';
        });
      });

      document.getElementById('otroBtn').addEventListener('click', () => {
        seleccionFija = null;
        controlsEl.querySelectorAll('[data-monto]').forEach(b => b.classList.remove('selected'));
        otroWrap.style.display = 'block';
        otroInput.focus();
      });

      otroInput.addEventListener('input', () => {
        otroInput.value = otroInput.value.replace(/[^0-9]/g, '');
      });

      document.getElementById('backBtn').addEventListener('click', () => {
        state.step = 'auth';
        render();
      });

      document.getElementById('retirarBtn').addEventListener('click', () => {
        const monto = seleccionFija !== null ? seleccionFija : parseInt(otroInput.value || '0', 10);

        if (!monto || monto <= 0) {
          feedback.innerHTML = `<div class="prompt-line"><span class="caret error">!</span><span class="error">Seleccione o ingrese un valor</span></div>`;
          return;
        }

        if (!esMontoValido(monto)) {
          goError(`No es posible entregar ${formatCOP(monto)} con las denominaciones disponibles ($10.000, $20.000, $50.000, $100.000).`);
          return;
        }

        state.monto = monto;
        state.step = 'result';
        render();
      });
    }

    function renderResult() {
      const cantidad = calcularRetiroCarreo(state.monto);

      const rows = NOMBRES.map((n, i) => `
      <div class="breakdown-row"><span>Billetes de ${n}</span><span class="dots"></span><span>${cantidad[i]}</span></div>
    `).join('');

      let reporteCuenta = '';
      if (state.accountType === 'nequi') {
        const vector11 = '0' + state.accountNumber;
        reporteCuenta = `
        <div class="prompt-line"><span class="caret">&gt;</span><span>Cuenta: NEQUI</span></div>
        <div class="prompt-line"><span class="caret muted">·</span><span class="muted">Vector reportado (11 dígitos): ${vector11}</span></div>
      `;
      } else if (state.accountType === 'mano') {
        reporteCuenta = `
        <div class="prompt-line"><span class="caret">&gt;</span><span>Cuenta: Ahorro a la mano</span></div>
        <div class="prompt-line"><span class="caret muted">·</span><span class="muted">Cuenta: ${state.accountNumber}</span></div>
      `;
      } else {
        reporteCuenta = `
        <div class="prompt-line"><span class="caret">&gt;</span><span>Cuenta: Ahorro</span></div>
        <div class="prompt-line"><span class="caret muted">·</span><span class="muted">Cuenta: ${state.accountNumber}</span></div>
      `;
      }

      const N = 1000;
      const valorMenor = state.monto - 10000;
      const proyeccion = valorMenor * N;

      screenEl.innerHTML = `
      ${reporteCuenta}
      <div class="breakdown">
        <div class="prompt-line"><span class="caret">&gt;</span><span>Desglose para ${formatCOP(state.monto)}:</span></div>
        ${rows}
        <div class="total-row"><span>Total entregado</span><span>${formatCOP(state.monto)}</span></div>
      </div>
      <div class="predict-box">
        <div>Predicción:</div>
        <div>Valor de referencia: <b>${formatCOP(valorMenor)}</b></div>
        <div>Proyección estimada: <b>${formatCOP(proyeccion)}</b></div>
      </div>
    `;

      controlsEl.innerHTML = `
      <button class="btn btn-primary" id="nuevoBtn">Nuevo retiro</button>
    `;
      document.getElementById('nuevoBtn').addEventListener('click', resetAll);

      billsEl.innerHTML = '';
      const totalBills = cantidad.reduce((a, b) => a + b, 0);
      if (totalBills === 0) {
        billsEl.innerHTML = '<div class="empty-note">— no hay billetes para este monto —</div>';
        return;
      }
      const MAX_VISUAL = 60;
      let shown = 0, delay = 0;
      for (let i = 0; i < cantidad.length; i++) {
        for (let k = 0; k < cantidad[i] && shown < MAX_VISUAL; k++) {
          const bill = document.createElement('div');
          bill.className = `bill ${CLASES[i]}`;
          bill.style.animationDelay = `${delay}ms`;
          bill.textContent = NOMBRES[i];
          billsEl.appendChild(bill);
          shown++;
          delay += 16;
        }
      }
      if (totalBills > MAX_VISUAL) {
        const note = document.createElement('div');
        note.className = 'empty-note';
        note.textContent = `+ ${totalBills - MAX_VISUAL} billetes más`;
        billsEl.appendChild(note);
      }
    }

    function renderErrorScreen() {
      screenEl.innerHTML = `
      <div class="prompt-line"><span class="caret error">!</span><span class="error">Operación no disponible</span></div>
      <div class="prompt-line"><span class="muted">${state.errorMsg}</span></div>
      <div class="prompt-line" style="margin-top:10px;"><span class="caret">&gt;</span><span>El proceso debe iniciarse nuevamente.</span></div>
    `;
      controlsEl.innerHTML = `<button class="btn btn-primary" id="restartBtn">Iniciar de nuevo</button>`;
      document.getElementById('restartBtn').addEventListener('click', resetAll);
      billsEl.innerHTML = '<div class="empty-note">— sin retiro aún —</div>';
    }

    render();
  </script>

</body>

</html>
